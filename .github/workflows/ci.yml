name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-not-a-real-secret
      AUTH_GITHUB_ID: ci-only
      AUTH_GITHUB_SECRET: ci-only
      SOCKET_AUTH_SECRET: ci-only-socket-secret-at-least-32-bytes
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test -- --reporter=dot
      - run: npm run lint

  backend:
    runs-on: ubuntu-latest
    env:
      SOCKET_AUTH_SECRET: ci-only-socket-secret-at-least-32-bytes
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=dot
